name: 不具合報告
description: 再現可能な不具合を報告する
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 秘密情報、個人情報、非公開の安全保障情報を入力しないでください。
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何が起きたかを簡潔に書いてください。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      placeholder: |
        1. 2026年へリセット
        2. 検証を選択
        3. 次の1年へ
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 実行環境
      placeholder: Node.js、OS、ブラウザ
  - type: checkboxes
    id: safety
    attributes:
      label: 安全確認
      options:
        - label: 報告にsecret、個人情報、非公開情報を含めていない
          required: true
