version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
      vite:
        patterns:
          - vite
          - "@vitejs/*"
